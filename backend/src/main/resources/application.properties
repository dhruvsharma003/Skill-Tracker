# Server Configuration
server.address=127.0.0.1
server.port=8080

# Spring Application
spring.application.name=skilltrack-backend

# Default Database: H2 in-memory (zero-setup out-of-the-box local execution)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:skilltrackdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (local debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Security & JWT Configuration
skilltrack.jwt.secret=${JWT_SECRET:SkillTrackSecretKeyForJwtTokenGeneration2026Secure256BitKey!}
skilltrack.jwt.expiration-ms=86400000

# Logging
logging.level.com.skilltrack=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
