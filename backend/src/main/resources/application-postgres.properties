# PostgreSQL / Amazon RDS Production Configuration
server.address=127.0.0.1
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skilltrackdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

skilltrack.jwt.secret=${JWT_SECRET:SkillTrackSecretKeyForJwtTokenGeneration2026Secure256BitKey!}
skilltrack.jwt.expiration-ms=86400000
